{% extends "base.html" %}

{% block title %}ShopMini | Bán hàng{% endblock %}

{% block content %}
<div class="container">
    <h1>Trang bán hàng</h1>

    <form class="user-form" action="{{ url_for('add_product') }}" method="POST" enctype="multipart/form-data">
        <input type="text" name="name" placeholder="Tên món hàng" required>
        <input type="number" step="0.01" min="0" name="price" placeholder="Giá tiền" required>
        <input type="file" name="image" accept=".png,.jpg,.jpeg" class="file-input">
        <button type="submit" class="primary-btn">Thêm món</button>
    </form>

    <div class="table-wrap">
        <table class="user-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên</th>
                    <th>Giá</th>
                    <th>Ảnh</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody>
                {% for product in products %}
                <tr data-name="{{ product['name']|lower }}" data-price="{{ product['price'] }}">
                    <td>{{ product['id'] }}</td>
                    <td>
                        <input type="text" form="edit-form-{{ product['id'] }}" name="name" value="{{ product['name'] }}" required>
                    </td>
                    <td>
                        <input type="number" step="0.01" min="0" form="edit-form-{{ product['id'] }}" name="price" value="{{ product['price'] }}" required>
                    </td>
                    <td>
                        <img class="mini-thumb" src="{{ url_for('static', filename='StockImage/' + (product['image'] or 'default.png')) }}" alt="{{ product['name'] }}">
                    </td>
                    <td class="actions-cell">
                        <form id="edit-form-{{ product['id'] }}" action="{{ url_for('edit_product', id=product['id']) }}" method="POST" enctype="multipart/form-data" class="inline-form">
                            <input type="hidden" name="name" value="{{ product['name'] }}">
                            <input type="hidden" name="price" value="{{ product['price'] }}">
                            <input type="file" name="image" accept=".png,.jpg,.jpeg" class="file-input inline-file">
                            <button type="submit" class="success-btn">Cập nhật</button>
                        </form>
                        <a href="{{ url_for('delete_product', id=product['id']) }}" class="delete-btn" data-name="{{ product['name'] }}">Xóa</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
