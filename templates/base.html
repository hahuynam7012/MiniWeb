<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ShareKnowlegeElectronic{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="container nav-wrap">
            <div class="brand">ShareKnowlegeElectronic</div>
            <nav class="main-nav" aria-label="Main navigation">
                <a href="{{ url_for('index') }}">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#">Contact</a>
            </nav>
        </div>
    </header>

    <div class="layout-shell">
        <aside class="sidebar" aria-label="Sidebar navigation">
            <div class="sidebar-title">Menu</div>
            <nav class="sidebar-nav">
                <a href="{{ url_for('index') }}" class="active">Dashboard</a>
                <a href="#">Users</a>
                <a href="#">Reports</a>
                <a href="#">Settings</a>
                <a href="#">Help</a>
            </nav>
        </aside>

        <main class="page-shell">
            {% block content %}{% endblock %}
        </main>
    </div>

    <footer class="footer">
        <div class="container footer-wrap">
            <p>© 2026 ShareKnowlegeElectronic</p>
            <p>Built with Flask + custom CSS</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
