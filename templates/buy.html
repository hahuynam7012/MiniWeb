{% extends "base.html" %}

{% block title %}ShopMini | Mua hàng{% endblock %}

{% block content %}
<div class="container">
    <h1>Trang mua hàng</h1>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Tìm kiếm món hàng..."><!--  -->
    </div>

    <div class="product-grid">
        {% for product in products %}
        <a class="product-card" href="{{ url_for('checkout', id=product['id']) }}" data-name="{{ product['name']|lower }}" data-price="{{ product['price'] }}">
            <div class="product-image-wrap">
                <img src="{{ url_for('static', filename='StockImage/' + (product['image'] or 'default.png')) }}" alt="{{ product['name'] }}">
            </div>
            <div class="product-info">
                <div class="product-id">ID: {{ product['id'] }}</div>
                <h3>{{ product['name'] }}</h3>
                <p class="price">{{ "{:,.0f}".format(product['price']) }}đ</p>
            </div>
        </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
